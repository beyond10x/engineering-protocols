format: els-fixture/1
id: candidate-moved
protocol: protocols/self-improvement/1.yaml
at: "2026-10-26T12:00:00Z"

# Candidate h1 is verified by run-b, merged and scored with no regression, and both capabilities
# are granted: the promotion is admissible. A commit moves the candidate to h2. The records about
# h1 are excluded as `revision_mismatch`: every claim about the candidate is unknown, not false,
# and neither a merge, the scorecard nor the promotion is admissible. The finding and the
# baseline are separate artifacts, so their claims stand.
case:
  format: canon-case/1
  id: SI-104
  protocol: self.improvement
  revision: c1
  inputs:
    surface: non_judge
  independence:
    run-a: []
    run-b: [different_agent_run]
  artifacts:
    finding: {revision: f1}
    baseline: {revision: b1}
    candidate: {revision: h1}
    promotion: {revision: p1}

states:
  - id: scored
    add_authority:
      - {capability: repository.merge, decision: granted}
      - {capability: takt.promote, decision: granted}
    add_evidence:
      - observed_at: "2026-10-26T08:00:00Z"
        record: {format: canon-evidence/1, id: finding-f1, kind: finding_record, result: filed,
                 subject: finding, subject_revision: f1}
      - observed_at: "2026-10-26T08:10:00Z"
        record: {format: canon-evidence/1, id: baseline-b1, kind: scenario_result,
                 result: reproduced, subject: baseline, subject_revision: b1, producer: run-a}
      - observed_at: "2026-10-26T09:00:00Z"
        record: {format: canon-evidence/1, id: candidate-h1, kind: scenario_result,
                 result: not_reproduced, subject: candidate, subject_revision: h1,
                 producer: run-b}
      - observed_at: "2026-10-26T09:30:00Z"
        record: {format: canon-evidence/1, id: merge-h1, kind: merge_observation,
                 result: merged, subject: candidate, subject_revision: h1}
      - observed_at: "2026-10-26T10:00:00Z"
        record: {format: canon-evidence/1, id: scorecard-h1, kind: scorecard_result,
                 result: no_regression, subject: candidate, subject_revision: h1}
    expect:
      claims:
        finding.cited: true
        scenario.reproduced_before: true
        scenario.passes_after: true
        fix.merged: true
        scorecard.no_regression: true
        promoted: unknown
      obligations:
        reproduction.required: discharged
        verification.required: discharged
        regression.required: discharged
      actions:
        finding.file: admissible
        scenario.reproduce: admissible
        scenario.verify: admissible
        candidate.merge: admissible
        candidate.merge_judge_surface: blocked
        scorecard.compare: admissible
        binary.promote: admissible
      outcomes: &none
        accepted: blocked
        declined: blocked
        unreproducible: blocked
        abandoned: blocked

  - id: candidate-moved
    set_revisions:
      candidate: h2
    add_evidence: []
    expect:
      claims:
        finding.cited: true
        scenario.reproduced_before: true
        scenario.passes_after: unknown
        fix.merged: unknown
        scorecard.no_regression: unknown
        promoted: unknown
      obligations:
        reproduction.required: discharged
        verification.required: open
        regression.required: open
      actions:
        finding.file: admissible
        scenario.reproduce: admissible
        scenario.verify: admissible
        candidate.merge: blocked
        candidate.merge_judge_surface: blocked
        scorecard.compare: blocked
        binary.promote: blocked
      outcomes: *none
