# The change is handed over at h1, its tests and the gate pass, but merging it would leave the
# base branch's tree unchanged outside .engineering/: `change.made` is false, so no pull request
# may be opened for content the base already has.
case:
  format: canon-case/1
  id: SD-104
  protocol: story.delivery
  revision: c1
  artifacts:
    intent: {revision: i1}
    plan: {revision: p1}
    implementation: {revision: h1}

states:
