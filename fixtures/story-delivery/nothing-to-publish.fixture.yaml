        record: {format: canon-evidence/1, id: gate-h1, kind: gate_result, result: pass,
                 subject: implementation, subject_revision: h1}
      - observed_at: "2026-10-26T09:30:00Z"
        record: {format: canon-evidence/1, id: change-h1, kind: change_record, result: none,
                 subject: implementation, subject_revision: h1}
    expect:
