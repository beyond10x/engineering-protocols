format: els-fixture/1
id: rolled-back
protocol: protocols/software-change/1.yaml
at: "2026-10-12T12:00:00Z"

# A change released as v2 and deployed, then rolled back. Rolling back needs authority, and neither
# the authority nor a rollback that only partly completed earns `rolled_back`. A complete result
# about v2 given after the partial one contradicts it: Canon reads two results about one release
# revision that disagree as UNKNOWN, so the outcome stays blocked. `rolled-back-complete` is the
# same case with the rollback complete and no partial result.
case:
  format: canon-case/1
  id: CHG-2004
  protocol: software.change
  inputs:
    risk: standard
    change_kind: refactor
  revision: c1
  artifacts:
    intent: {revision: i1}
    system_specification: {revision: s1}
    plan: {revision: p1}
    implementation: {revision: R2}
    release: {revision: v2}
    deployment: {revision: d2}

states:
  - id: initial
    add_evidence: []
    expect:
      claims:
        tests.pass: unknown
        implementation.reviewed: unknown
        implementation.verified: unknown
        release.proven: unknown
        deployment.healthy: unknown
        objective.realized: unknown
        regression.reproduced: unknown
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: admissible
        tests.run: admissible
        repository.merge: blocked
        release.rollback: approval-required
      outcomes:
        accepted: blocked
        declined: blocked
        rolled_back: blocked
        superseded: blocked
        abandoned: blocked

  - id: rollback-partial
    add_authority:
      - {capability: release.rollback, decision: granted}
    add_evidence:
      - observed_at: "2026-10-12T10:00:00Z"
        record: {format: canon-evidence/1, id: rollback-v2-partial, kind: rollback_result,
                 result: partial, subject: release, subject_revision: v2}
    expect:
      claims:
        tests.pass: unknown
        implementation.reviewed: unknown
        implementation.verified: unknown
        release.proven: unknown
        deployment.healthy: unknown
        objective.realized: unknown
        regression.reproduced: unknown
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: admissible
        tests.run: admissible
        repository.merge: blocked
        release.rollback: admissible
      outcomes:
        accepted: blocked
        declined: blocked
        rolled_back: blocked
        superseded: blocked
        abandoned: blocked

  - id: complete-after-partial
    add_evidence:
      - observed_at: "2026-10-12T10:20:00Z"
        record: {format: canon-evidence/1, id: rollback-v2-complete, kind: rollback_result,
                 result: complete, subject: release, subject_revision: v2}
    expect:
      claims:
        tests.pass: unknown
        implementation.reviewed: unknown
        implementation.verified: unknown
        release.proven: unknown
        deployment.healthy: unknown
        objective.realized: unknown
        regression.reproduced: unknown
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: admissible
        tests.run: admissible
        repository.merge: blocked
        release.rollback: admissible
      outcomes:
        accepted: blocked
        declined: blocked
        rolled_back: blocked
        superseded: blocked
        abandoned: blocked
