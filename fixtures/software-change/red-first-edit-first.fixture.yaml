format: els-fixture/1
id: red-first-edit-first
protocol: protocols/software-change/1.yaml
at: "2026-10-13T12:00:00Z"

# One bugfix at standard risk whose implementation was changed, to R2 at 09:00, before any
# regression test ran (acceptance 3 of the red-first rule). The change is the first record of
# either kind, so `regression.shown_first` is FALSE and `red_first.required` is open; nothing
# reproduces the regression, so a further edit is blocked. A regression test that fails on R2 at
# 10:00 reproduces the regression, which admits the edit, but it came after the first change: the
# order cannot be repaired and the obligation stays open.
case:
  format: canon-case/1
  id: CHG-3004
  protocol: software.change
  inputs:
    risk: standard
    change_kind: bugfix
  artifacts:
    intent: {revision: i1}
    system_specification: {revision: s1}
    plan: {revision: p1}
    implementation: {revision: R1}
    release: {revision: v0}
    deployment: {revision: d0}

states:
  - id: edited-unreproduced
    set_revisions:
      implementation: R2
    add_evidence:
      - observed_at: "2026-10-13T09:00:00Z"
        record:
          format: canon-evidence/1
          id: change-r2
          kind: implementation_change
          subject: implementation
          subject_revision: R2
    expect:
      claims:
        tests.pass: unknown
        implementation.reviewed: unknown
        implementation.verified: unknown
        release.proven: unknown
        deployment.healthy: unknown
        objective.realized: unknown
        regression.reproduced: unknown
        regression.shown_first: false
      obligations:
        tests.required: open
        review.required: open
        provenance.required: not_applicable
        health.required: not_applicable
        red_first.required: open
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: blocked
        tests.run: admissible
        repository.merge: blocked
        release.rollback: approval-required

  - id: red-after-edit
    add_evidence:
      - observed_at: "2026-10-13T10:00:00Z"
        record:
          format: canon-evidence/1
          id: regression-r2-fail
          kind: regression_test_result
          result: fail
          subject: implementation
          subject_revision: R2
    expect:
      claims:
        tests.pass: unknown
        implementation.reviewed: unknown
        implementation.verified: unknown
        release.proven: unknown
        deployment.healthy: unknown
        objective.realized: unknown
        regression.reproduced: true
        regression.shown_first: false
      obligations:
        tests.required: open
        review.required: open
        provenance.required: not_applicable
        health.required: not_applicable
        red_first.required: open
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: admissible
        tests.run: admissible
        repository.merge: blocked
        release.rollback: approval-required
