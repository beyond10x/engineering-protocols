format: els-fixture/1
id: red-first
protocol: protocols/software-change/1.yaml
at: "2026-10-13T12:00:00Z"

# One bugfix at standard risk and implementation revision R1, with no authority decision, run the
# red-first way. The suite passes on R1 at 09:00; the regression test is written and fails on R1 at
# 10:00, which reproduces the regression although the suite's earlier green run is about R1 too,
# since the two runs are of different kinds. The edit at 11:00 moves the implementation to R2: the
# red run is about R1 and no longer matches, but it is still the first regression test result, so
# the regression stays reproduced, and it came before the first implementation change, which
# discharges `red_first.required`. A second edit, to R3, still may be made. A feature and a
# refactor then show that `red_first.required` applies to a bugfix only.
# The evaluation reads each record's observation time (the order forms `first` and `before` read
# it); the instant of the fixture is not passed, so nothing expires.
case:
  format: canon-case/1
  id: CHG-3003
  protocol: software.change
  inputs:
    risk: standard
    change_kind: bugfix
  artifacts:
    intent: {revision: i1}
    system_specification: {revision: s1}
    plan: {revision: p1}
    implementation: {revision: R1}
    release: {revision: v0}
    deployment: {revision: d0}

states:
  - id: bugfix
    add_evidence: []
    expect:
      claims:
        tests.pass: unknown
        implementation.reviewed: unknown
        implementation.verified: unknown
        release.proven: unknown
        deployment.healthy: unknown
        objective.realized: unknown
        regression.reproduced: unknown
        regression.shown_first: unknown
      obligations:
        tests.required: open
        review.required: open
        provenance.required: not_applicable
        health.required: not_applicable
        red_first.required: open
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: blocked
        tests.run: admissible
        repository.merge: blocked
        release.rollback: approval-required

  # The suite's green run on R1 reproduces nothing.
  - id: suite-green
    add_evidence:
      - observed_at: "2026-10-13T09:00:00Z"
        record:
          format: canon-evidence/1
          id: suite-r1-pass
          kind: test_result
          result: pass
          subject: implementation
          subject_revision: R1
    expect:
      claims:
        tests.pass: true
        implementation.reviewed: unknown
        implementation.verified: true
        release.proven: unknown
        deployment.healthy: unknown
        objective.realized: unknown
        regression.reproduced: unknown
        regression.shown_first: unknown
      obligations:
        tests.required: discharged
        review.required: open
        provenance.required: not_applicable
        health.required: not_applicable
        red_first.required: open
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: blocked
        tests.run: admissible
        repository.merge: approval-required
        release.rollback: approval-required

  # Acceptance 1: green then red on one revision, the red one the regression test's.
  - id: regression-red
    add_evidence:
      - observed_at: "2026-10-13T10:00:00Z"
        record:
          format: canon-evidence/1
          id: regression-r1-fail
          kind: regression_test_result
          result: fail
          subject: implementation
          subject_revision: R1
    expect:
      claims:
        tests.pass: true
        implementation.reviewed: unknown
        implementation.verified: true
        release.proven: unknown
        deployment.healthy: unknown
        objective.realized: unknown
        regression.reproduced: true
        regression.shown_first: unknown
      obligations:
        tests.required: discharged
        review.required: open
        provenance.required: not_applicable
        health.required: not_applicable
        red_first.required: open
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: admissible
        tests.run: admissible
        repository.merge: approval-required
        release.rollback: approval-required

  # Acceptance 2: the edit moves the implementation to R2; the red run about R1 still counts.
  - id: edited
    set_revisions:
      implementation: R2
    add_evidence:
      - observed_at: "2026-10-13T11:00:00Z"
        record:
          format: canon-evidence/1
          id: change-r2
          kind: implementation_change
          subject: implementation
          subject_revision: R2
    expect:
      claims: &edited
        tests.pass: unknown
        implementation.reviewed: unknown
        implementation.verified: unknown
        release.proven: unknown
        deployment.healthy: unknown
        objective.realized: unknown
        regression.reproduced: true
        regression.shown_first: true
      obligations:
        tests.required: open
        review.required: open
        provenance.required: not_applicable
        health.required: not_applicable
        red_first.required: discharged
      actions: &editable
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: admissible
        tests.run: admissible
        repository.merge: blocked
        release.rollback: approval-required

  # A fix that needs a second edit makes it without a new red run on R2.
  - id: edited-again
    set_revisions:
      implementation: R3
    add_evidence:
      - observed_at: "2026-10-13T11:30:00Z"
        record:
          format: canon-evidence/1
          id: change-r3
          kind: implementation_change
          subject: implementation
          subject_revision: R3
    expect:
      claims: *edited
      obligations:
        tests.required: open
        review.required: open
        provenance.required: not_applicable
        health.required: not_applicable
        red_first.required: discharged
      actions: *editable

  # Acceptance 5: a feature and a refactor do not carry `red_first.required`.
  - id: feature
    set_inputs:
      change_kind: feature
    add_evidence: []
    expect:
      claims: *edited
      obligations: &kind-free
        tests.required: open
        review.required: open
        provenance.required: not_applicable
        health.required: not_applicable
        red_first.required: not_applicable
      actions: *editable

  - id: refactor
    set_inputs:
      change_kind: refactor
    add_evidence: []
    expect:
      claims: *edited
      obligations: *kind-free
      actions: *editable
