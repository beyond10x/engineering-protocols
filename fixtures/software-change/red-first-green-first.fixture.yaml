format: els-fixture/1
id: red-first-green-first
protocol: protocols/software-change/1.yaml
at: "2026-10-13T12:00:00Z"

# One bugfix at standard risk and implementation revision R1 whose regression test passed first,
# at 09:00 (acceptance 4 of the red-first rule). The first regression test result is not a fail,
# so `first` is FALSE and stays FALSE when the test fails later, at 10:00: the regression test
# reproduced nothing, and the edit is blocked. A suite run that fails on R1 at 11:00 reproduces the
# regression on the current revision, which admits the edit. The regression test was never red
# first, so `regression.shown_first` is FALSE from its first run on, and stays FALSE when the edit
# at 11:30 moves the implementation to R2 although the regression test ran before that change:
# `red_first.required` is open in every state.
case:
  format: canon-case/1
  id: CHG-3005
  protocol: software.change
  inputs:
    risk: standard
    change_kind: bugfix
    affects_security_boundary: false
  artifacts:
    intent: {revision: i1}
    system_specification: {revision: s1}
    plan: {revision: p1}
    implementation: {revision: R1}
    release: {revision: v0}
    deployment: {revision: d0}

states:
  - id: regression-green
    add_evidence:
      - observed_at: "2026-10-13T09:00:00Z"
        record:
          format: canon-evidence/1
          id: regression-r1-pass
          kind: regression_test_result
          result: pass
          subject: implementation
          subject_revision: R1
    expect:
      claims: &unreproduced
        tests.pass: unknown
        implementation.reviewed: unknown
        implementation.verified: unknown
        release.proven: unknown
        deployment.healthy: unknown
        objective.realized: unknown
        regression.reproduced: unknown
        regression.shown_first: false
        security.reviewed: unknown
      obligations: &open
        tests.required: open
        review.required: open
        provenance.required: not_applicable
        health.required: not_applicable
        red_first.required: open
        security_review.required: not_applicable
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: blocked
        tests.run: admissible
        repository.merge: blocked
        release.rollback: approval-required

  - id: regression-red-later
    add_evidence:
      - observed_at: "2026-10-13T10:00:00Z"
        record:
          format: canon-evidence/1
          id: regression-r1-fail
          kind: regression_test_result
          result: fail
          subject: implementation
          subject_revision: R1
    expect:
      claims: *unreproduced
      obligations: *open
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: blocked
        tests.run: admissible
        repository.merge: blocked
        release.rollback: approval-required

  - id: suite-red
    add_evidence:
      - observed_at: "2026-10-13T11:00:00Z"
        record:
          format: canon-evidence/1
          id: suite-r1-fail
          kind: test_result
          result: fail
          subject: implementation
          subject_revision: R1
    expect:
      claims:
        tests.pass: false
        implementation.reviewed: unknown
        implementation.verified: false
        release.proven: false
        deployment.healthy: unknown
        objective.realized: unknown
        regression.reproduced: true
        regression.shown_first: false
        security.reviewed: unknown
      obligations: *open
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: admissible
        tests.run: admissible
        repository.merge: blocked
        release.rollback: approval-required

  # The edit moves the implementation to R2. The regression test ran before it, but never red
  # first, so the obligation stays open; the suite's red run is about R1 and no longer counts.
  - id: edited
    set_revisions:
      implementation: R2
    add_evidence:
      - observed_at: "2026-10-13T11:30:00Z"
        record:
          format: canon-evidence/1
          id: change-r2
          kind: implementation_change
          subject: implementation
          subject_revision: R2
    expect:
      claims: *unreproduced
      obligations: *open
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: blocked
        tests.run: admissible
        repository.merge: blocked
        release.rollback: approval-required
