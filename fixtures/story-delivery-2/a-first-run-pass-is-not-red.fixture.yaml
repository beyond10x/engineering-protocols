format: els-fixture/1
id: a-first-run-pass-is-not-red
protocol: protocols/story-delivery/2.yaml
at: "2026-10-27T12:00:00Z"

# A story whose case requires its tests first. The tests are written at h2 and their first run
# passes: `tests.pass` is true, but the tests were not red, so `tests.shown_red` is false and the
# implementation may not be edited. Rewritten tests at h3 that fail do not undo the first run: the
# first run of the tests is the one that counts, so the edit stays refused.
case:
  format: canon-case/1
  id: SD-202
  protocol: story.delivery
  revision: c1
  artifacts:
    intent: {revision: i1}
    plan: {revision: p1}
    implementation: {revision: h1}
  inputs:
    tests_first: required
    gate_on: each_revision

states:
  - id: tests-written
    set_revisions:
      implementation: h2
    add_evidence:
      - observed_at: "2026-10-27T09:00:00Z"
        record: {format: canon-evidence/1, id: tests-written-h2, kind: tests_change,
                 subject: implementation, subject_revision: h2}
    expect:
      claims: &unknown
        change.complete: unknown
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: unknown
        tests.shown_red: unknown
      actions: &edit-refused
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: blocked
        change.handover: admissible
        change.read: blocked
        tests.run: admissible
        gate.run: admissible
        pr.open: blocked
        ci.read: blocked
        repository.merge: blocked

  - id: first-run-passes
    add_evidence:
      - observed_at: "2026-10-27T09:10:00Z"
        record: {format: canon-evidence/1, id: tests-h2-pass, kind: test_result, result: pass,
                 subject: implementation, subject_revision: h2}
    expect:
      claims:
        change.complete: unknown
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: true
        tests.shown_red: false
      actions: *edit-refused

  - id: a-later-red-run-does-not-count
    set_revisions:
      implementation: h3
    add_evidence:
      - observed_at: "2026-10-27T09:20:00Z"
        record: {format: canon-evidence/1, id: tests-written-h3, kind: tests_change,
                 subject: implementation, subject_revision: h3}
      - observed_at: "2026-10-27T09:30:00Z"
        record: {format: canon-evidence/1, id: tests-h3-red, kind: test_result, result: fail,
                 subject: implementation, subject_revision: h3}
    expect:
      claims:
        change.complete: false
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: false
        tests.shown_red: false
      actions: *edit-refused
