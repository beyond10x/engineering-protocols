format: els-fixture/1
id: baseline-pass-then-red
protocol: protocols/story-delivery/2.yaml
at: "2026-10-27T12:00:00Z"

# A story whose case requires its tests first. The suite passes at the seed h1 before the story
# writes any tests: nothing is red, and the edit is refused. The tests are written at h2, which
# the baseline does not touch, and fail there: the edit is admissible. A baseline run neither
# locks the edit out nor admits it.
case:
  format: canon-case/1
  id: SD-208
  protocol: story.delivery
  revision: c1
  artifacts:
    intent: {revision: i1}
    plan: {revision: p1}
    implementation: {revision: h1}
  inputs:
    tests_first: required
    gate_on: each_revision

states:
  - id: baseline
    add_evidence:
      - observed_at: "2026-10-27T08:00:00Z"
        record: {format: canon-evidence/1, id: tests-h1-pass, kind: test_result, result: pass,
                 subject: implementation, subject_revision: h1}
    expect:
      claims:
        change.complete: unknown
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: true
        tests.shown_red: false
      actions: &edit-refused
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: blocked
        change.handover: admissible
        change.read: blocked
        tests.run: admissible
        gate.run: admissible
        pr.open: blocked
        ci.read: blocked
        repository.merge: blocked

  - id: tests-written
    set_revisions:
      implementation: h2
    add_evidence:
      - observed_at: "2026-10-27T09:00:00Z"
        record: {format: canon-evidence/1, id: tests-written-h2, kind: tests_change,
                 subject: implementation, subject_revision: h2}
    expect:
      claims:
        change.complete: unknown
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: unknown
        tests.shown_red: unknown
      actions: *edit-refused

  - id: red
    add_evidence:
      - observed_at: "2026-10-27T10:00:00Z"
        record: {format: canon-evidence/1, id: tests-h2-red, kind: test_result, result: fail,
                 subject: implementation, subject_revision: h2}
    expect:
      claims:
        change.complete: false
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: false
        tests.shown_red: true
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: admissible
        change.handover: admissible
        change.read: blocked
        tests.run: admissible
        gate.run: admissible
        pr.open: blocked
        ci.read: blocked
        repository.merge: blocked
