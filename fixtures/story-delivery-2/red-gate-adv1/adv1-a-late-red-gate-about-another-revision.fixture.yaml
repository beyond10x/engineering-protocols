format: els-fixture/1
id: adv1-a-late-red-gate-about-another-revision
protocol: protocols/story-delivery/2.yaml
at: "2026-10-27T12:00:00Z"

# Adversary case. Tests first required, the gate at every revision. The tests are written and red
# at h2, the implementation edited to h3 where they pass, and then a gate failure about h2 arrives
# late (a run started before the edit). It says nothing about h3: `gate.green` stays unknown there
# and the edit stays refused.
case:
  format: canon-case/1
  id: SD-ADV1-4
  protocol: story.delivery
  revision: c1
  artifacts:
    intent: {revision: i1}
    plan: {revision: p1}
    implementation: {revision: h1}
  inputs:
    tests_first: required
    gate_on: each_revision

states:
  - id: tests-red
    set_revisions:
      implementation: h2
    add_evidence:
      - observed_at: "2026-10-27T09:00:00Z"
        record: {format: canon-evidence/1, id: tests-written-h2, kind: tests_change,
                 subject: implementation, subject_revision: h2}
      - observed_at: "2026-10-27T09:10:00Z"
        record: {format: canon-evidence/1, id: tests-h2-fail, kind: test_result, result: fail,
                 subject: implementation, subject_revision: h2}
    expect:
      claims:
        change.complete: false
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: false
        tests.shown_red: true

  - id: edited-green
    set_revisions:
      implementation: h3
    add_evidence:
      - observed_at: "2026-10-27T09:20:00Z"
        record: {format: canon-evidence/1, id: tests-h3-pass, kind: test_result, result: pass,
                 subject: implementation, subject_revision: h3}
    expect:
      claims: &green-no-gate
        change.complete: unknown
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: true
        tests.shown_red: false

  - id: late-gate-red-about-h2
    add_evidence:
      - observed_at: "2026-10-27T09:30:00Z"
        record: {format: canon-evidence/1, id: gate-h2-fail, kind: gate_result, result: fail,
                 subject: implementation, subject_revision: h2}
    expect:
      claims: *green-no-gate
