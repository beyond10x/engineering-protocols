format: els-fixture/1
id: a-red-gate-admits-the-edit
protocol: protocols/story-delivery/2.yaml
at: "2026-10-27T12:00:00Z"

# A story whose case requires its tests first and runs the gate after the handover. The tests are
# written and red at h2, the implementation edited to h3, where they pass and the change is handed
# over. The gate then fails at h3 on something no test reads, such as formatting: the tests are
# not red there, but a red gate at the current revision admits the edit, so the failure can be
# fixed. At h4 the gate has not run, and the edit is refused again until something is red.
case:
  format: canon-case/1
  id: SD-206
  protocol: story.delivery
  revision: c1
  artifacts:
    intent: {revision: i1}
    plan: {revision: p1}
    implementation: {revision: h1}
  inputs:
    tests_first: required
    gate_on: after_handover

states:
  - id: tests-red
    set_revisions:
      implementation: h2
    add_evidence:
      - observed_at: "2026-10-27T09:00:00Z"
        record: {format: canon-evidence/1, id: tests-written-h2, kind: tests_change,
                 subject: implementation, subject_revision: h2}
      - observed_at: "2026-10-27T09:10:00Z"
        record: {format: canon-evidence/1, id: tests-h2-fail, kind: test_result, result: fail,
                 subject: implementation, subject_revision: h2}
    expect:
      claims:
        change.complete: false
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: false
        tests.shown_red: true
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: admissible
        change.handover: admissible
        change.read: blocked
        tests.run: admissible
        gate.run: blocked
        pr.open: blocked
        ci.read: blocked
        repository.merge: blocked

  - id: green-and-handed-over
    set_revisions:
      implementation: h3
    add_evidence:
      - observed_at: "2026-10-27T09:20:00Z"
        record: {format: canon-evidence/1, id: tests-h3-pass, kind: test_result, result: pass,
                 subject: implementation, subject_revision: h3}
      - observed_at: "2026-10-27T09:30:00Z"
        record: {format: canon-evidence/1, id: handover-h3, kind: handover,
                 subject: implementation, subject_revision: h3}
    expect:
      claims:
        change.complete: unknown
        change.handed_over: true
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: true
        tests.shown_red: false
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: blocked
        change.handover: blocked
        change.read: admissible
        tests.run: admissible
        gate.run: admissible
        pr.open: blocked
        ci.read: blocked
        repository.merge: blocked

  - id: gate-red
    add_evidence:
      - observed_at: "2026-10-27T09:40:00Z"
        record: {format: canon-evidence/1, id: gate-h3-fail, kind: gate_result, result: fail,
                 subject: implementation, subject_revision: h3}
    expect:
      claims:
        change.complete: false
        change.handed_over: true
        change.made: unknown
        ci.green: unknown
        gate.green: false
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: true
        tests.shown_red: false
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: admissible
        change.handover: blocked
        change.read: admissible
        tests.run: admissible
        gate.run: admissible
        pr.open: blocked
        ci.read: blocked
        repository.merge: blocked

  - id: fixed-not-yet-gated
    set_revisions:
      implementation: h4
    add_evidence:
      - observed_at: "2026-10-27T09:50:00Z"
        record: {format: canon-evidence/1, id: tests-h4-pass, kind: test_result, result: pass,
                 subject: implementation, subject_revision: h4}
    expect:
      claims:
        change.complete: unknown
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: true
        tests.shown_red: false
      actions:
        repository.inspect: admissible
        tests.write: admissible
        implementation.edit: blocked
        change.handover: admissible
        change.read: blocked
        tests.run: admissible
        gate.run: blocked
        pr.open: blocked
        ci.read: blocked
        repository.merge: blocked
