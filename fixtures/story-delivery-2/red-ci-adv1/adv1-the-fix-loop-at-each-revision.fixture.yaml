format: els-fixture/1
id: adv1-the-fix-loop-at-each-revision
protocol: protocols/story-delivery/2.yaml
at: "2026-10-27T12:00:00Z"

# Adversary case. Tests first required, the gate at every revision. The tests are red at h2, pass
# at h3, the change is handed over, gated and opened at h3, and CI fails there. The gate is run
# again at h3 and fails (a red CI and a red gate together, the gate records disagreeing). The
# implementation is edited to h4, where the tests and the gate pass: nothing is red at h4 and the
# edit is refused, though h3's red records stand. The change is handed over and opened at h4, CI
# passes there, and the pull request is merged: the loop ends in `accepted`.
case:
  format: canon-case/1
  id: SD-ADV1-CI-5
  protocol: story.delivery
  revision: c1
  artifacts:
    intent: {revision: i1}
    plan: {revision: p1}
    implementation: {revision: h1}
  inputs:
    tests_first: required
    gate_on: each_revision

states:
  - id: tests-red
    set_revisions:
      implementation: h2
    add_evidence:
      - observed_at: "2026-10-27T09:00:00Z"
        record: {format: canon-evidence/1, id: tests-written-h2, kind: tests_change,
                 subject: implementation, subject_revision: h2}
      - observed_at: "2026-10-27T09:10:00Z"
        record: {format: canon-evidence/1, id: tests-h2-fail, kind: test_result, result: fail,
                 subject: implementation, subject_revision: h2}
    expect:
      claims:
        change.complete: false
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: false
        tests.shown_red: true

  - id: green-gated-and-opened
    set_revisions:
      implementation: h3
    add_evidence:
      - observed_at: "2026-10-27T09:20:00Z"
        record: {format: canon-evidence/1, id: tests-h3-pass, kind: test_result, result: pass,
                 subject: implementation, subject_revision: h3}
      - observed_at: "2026-10-27T09:25:00Z"
        record: {format: canon-evidence/1, id: gate-h3-pass, kind: gate_result, result: pass,
                 subject: implementation, subject_revision: h3}
      - observed_at: "2026-10-27T09:30:00Z"
        record: {format: canon-evidence/1, id: handover-h3, kind: handover,
                 subject: implementation, subject_revision: h3}
      - observed_at: "2026-10-27T09:31:00Z"
        record: {format: canon-evidence/1, id: change-h3, kind: change_record, result: ahead,
                 subject: implementation, subject_revision: h3}
      - observed_at: "2026-10-27T09:31:00Z"
        record: {format: canon-evidence/1, id: paths-h3, kind: paths_changed, result: both,
                 subject: implementation, subject_revision: h3}
      - observed_at: "2026-10-27T09:45:00Z"
        record: {format: canon-evidence/1, id: pr-h3, kind: pull_request, result: open,
                 subject: implementation, subject_revision: h3}
    expect:
      claims:
        change.complete: true
        change.handed_over: true
        change.made: true
        ci.green: unknown
        gate.green: true
        pr.merged: unknown
        pr.opened: true
        tests.pass: true
        tests.shown_red: false

  - id: ci-red
    add_evidence:
      - observed_at: "2026-10-27T10:00:00Z"
        record: {format: canon-evidence/1, id: ci-h3-fail, kind: ci_result, result: fail,
                 subject: implementation, subject_revision: h3}
    expect:
      claims:
        change.complete: true
        change.handed_over: true
        change.made: true
        ci.green: false
        gate.green: true
        pr.merged: unknown
        pr.opened: true
        tests.pass: true
        tests.shown_red: false

  - id: ci-red-and-gate-rerun-red
    add_evidence:
      - observed_at: "2026-10-27T10:05:00Z"
        record: {format: canon-evidence/1, id: gate-h3-fail, kind: gate_result, result: fail,
                 subject: implementation, subject_revision: h3}
    expect:
      claims:
        change.complete: unknown
        change.handed_over: true
        change.made: true
        ci.green: false
        gate.green: unknown
        pr.merged: unknown
        pr.opened: true
        tests.pass: true
        tests.shown_red: false

  - id: fixed-tests-and-gate-green
    set_revisions:
      implementation: h4
    add_evidence:
      - observed_at: "2026-10-27T10:10:00Z"
        record: {format: canon-evidence/1, id: tests-h4-pass, kind: test_result, result: pass,
                 subject: implementation, subject_revision: h4}
      - observed_at: "2026-10-27T10:15:00Z"
        record: {format: canon-evidence/1, id: gate-h4-pass, kind: gate_result, result: pass,
                 subject: implementation, subject_revision: h4}
    expect:
      claims:
        change.complete: unknown
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: true
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: true
        tests.shown_red: false

  - id: opened-and-ci-green
    add_evidence:
      - observed_at: "2026-10-27T10:20:00Z"
        record: {format: canon-evidence/1, id: handover-h4, kind: handover,
                 subject: implementation, subject_revision: h4}
      - observed_at: "2026-10-27T10:21:00Z"
        record: {format: canon-evidence/1, id: change-h4, kind: change_record, result: ahead,
                 subject: implementation, subject_revision: h4}
      - observed_at: "2026-10-27T10:21:00Z"
        record: {format: canon-evidence/1, id: paths-h4, kind: paths_changed, result: both,
                 subject: implementation, subject_revision: h4}
      - observed_at: "2026-10-27T10:25:00Z"
        record: {format: canon-evidence/1, id: pr-h4, kind: pull_request, result: open,
                 subject: implementation, subject_revision: h4}
      - observed_at: "2026-10-27T10:30:00Z"
        record: {format: canon-evidence/1, id: ci-h4-pass, kind: ci_result, result: pass,
                 subject: implementation, subject_revision: h4}
    expect:
      claims:
        change.complete: true
        change.handed_over: true
        change.made: true
        ci.green: true
        gate.green: true
        pr.merged: unknown
        pr.opened: true
        tests.pass: true
        tests.shown_red: false

  - id: merged
    add_evidence:
      - observed_at: "2026-10-27T10:40:00Z"
        record: {format: canon-evidence/1, id: merged-h4, kind: merge_observation, result: merged,
                 subject: implementation, subject_revision: h4}
    expect:
      claims:
        change.complete: true
        change.handed_over: true
        change.made: true
        ci.green: true
        gate.green: true
        pr.merged: true
        pr.opened: true
        tests.pass: true
        tests.shown_red: false
