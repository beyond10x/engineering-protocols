format: els-fixture/1
id: adv1-a-late-red-ci-about-another-revision
protocol: protocols/story-delivery/2.yaml
at: "2026-10-27T12:00:00Z"

# Adversary case. Tests first required, the gate after the handover. The tests are red at h2,
# pass at h3, the change is handed over, gated and its pull request opened at h3. Before any CI is
# read, the tests are written again (h4) and pass there on their first run. Then a CI failure
# about h3 arrives late. It says nothing about h4: `ci.green` stays unknown and the edit stays
# refused.
case:
  format: canon-case/1
  id: SD-ADV1-CI-1
  protocol: story.delivery
  revision: c1
  artifacts:
    intent: {revision: i1}
    plan: {revision: p1}
    implementation: {revision: h1}
  inputs:
    tests_first: required
    gate_on: after_handover

states:
  - id: tests-red
    set_revisions:
      implementation: h2
    add_evidence:
      - observed_at: "2026-10-27T09:00:00Z"
        record: {format: canon-evidence/1, id: tests-written-h2, kind: tests_change,
                 subject: implementation, subject_revision: h2}
      - observed_at: "2026-10-27T09:10:00Z"
        record: {format: canon-evidence/1, id: tests-h2-fail, kind: test_result, result: fail,
                 subject: implementation, subject_revision: h2}
    expect:
      claims:
        change.complete: false
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: false
        tests.shown_red: true

  - id: green-gated-and-opened
    set_revisions:
      implementation: h3
    add_evidence:
      - observed_at: "2026-10-27T09:20:00Z"
        record: {format: canon-evidence/1, id: tests-h3-pass, kind: test_result, result: pass,
                 subject: implementation, subject_revision: h3}
      - observed_at: "2026-10-27T09:30:00Z"
        record: {format: canon-evidence/1, id: handover-h3, kind: handover,
                 subject: implementation, subject_revision: h3}
      - observed_at: "2026-10-27T09:31:00Z"
        record: {format: canon-evidence/1, id: change-h3, kind: change_record, result: ahead,
                 subject: implementation, subject_revision: h3}
      - observed_at: "2026-10-27T09:31:00Z"
        record: {format: canon-evidence/1, id: paths-h3, kind: paths_changed, result: both,
                 subject: implementation, subject_revision: h3}
      - observed_at: "2026-10-27T09:40:00Z"
        record: {format: canon-evidence/1, id: gate-h3-pass, kind: gate_result, result: pass,
                 subject: implementation, subject_revision: h3}
      - observed_at: "2026-10-27T09:45:00Z"
        record: {format: canon-evidence/1, id: pr-h3, kind: pull_request, result: open,
                 subject: implementation, subject_revision: h3}
    expect:
      claims:
        change.complete: true
        change.handed_over: true
        change.made: true
        ci.green: unknown
        gate.green: true
        pr.merged: unknown
        pr.opened: true
        tests.pass: true
        tests.shown_red: false

  - id: tests-rewritten-and-passing
    set_revisions:
      implementation: h4
    add_evidence:
      - observed_at: "2026-10-27T10:00:00Z"
        record: {format: canon-evidence/1, id: tests-written-h4, kind: tests_change,
                 subject: implementation, subject_revision: h4}
      - observed_at: "2026-10-27T10:05:00Z"
        record: {format: canon-evidence/1, id: tests-h4-pass, kind: test_result, result: pass,
                 subject: implementation, subject_revision: h4}
    expect:
      claims: &rewritten
        change.complete: unknown
        change.handed_over: unknown
        change.made: unknown
        ci.green: unknown
        gate.green: unknown
        pr.merged: unknown
        pr.opened: unknown
        tests.pass: true
        tests.shown_red: false

  - id: late-ci-red-about-h3
    add_evidence:
      - observed_at: "2026-10-27T10:10:00Z"
        record: {format: canon-evidence/1, id: ci-h3-fail, kind: ci_result, result: fail,
                 subject: implementation, subject_revision: h3}
    expect:
      claims: *rewritten
