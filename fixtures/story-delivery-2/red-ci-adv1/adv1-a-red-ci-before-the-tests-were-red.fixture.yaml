# Adversary case, the continuous-integration sibling of `adv1-a-red-gate-before-the-tests-were-red`.
# Tests first required, the gate after the handover. The tests are written at h2 and their first
# run passes, so they were never red. The change is handed over at h2, the gate is green and the
# pull request open. Then continuous integration fails at h2 on something no test reads. The tests
# were still never red; the red CI must not admit the edit, or any story can skip red-first by
# letting continuous integration fail.
case:
  format: canon-case/1
  id: SD-ADV1-RC-7
  protocol: story.delivery
  revision: c1
  artifacts:
    intent: {revision: i1}
    plan: {revision: p1}
    implementation: {revision: h1}
  inputs:
    tests_first: required
    gate_on: after_handover

states:
