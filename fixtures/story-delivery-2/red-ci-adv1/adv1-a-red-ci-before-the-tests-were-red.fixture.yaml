    set_revisions:
      implementation: h2
    add_evidence:
      - observed_at: "2026-10-27T09:00:00Z"
        record: {format: canon-evidence/1, id: tests-written-h2, kind: tests_change,
                 subject: implementation, subject_revision: h2}
      - observed_at: "2026-10-27T09:10:00Z"
        record: {format: canon-evidence/1, id: tests-h2-pass, kind: test_result, result: pass,
                 subject: implementation, subject_revision: h2}
      - observed_at: "2026-10-27T09:30:00Z"
        record: {format: canon-evidence/1, id: handover-h2, kind: handover,
                 subject: implementation, subject_revision: h2}
      - observed_at: "2026-10-27T09:31:00Z"
        record: {format: canon-evidence/1, id: change-h2, kind: change_record, result: ahead,
                 subject: implementation, subject_revision: h2}
      - observed_at: "2026-10-27T09:31:00Z"
        record: {format: canon-evidence/1, id: paths-h2, kind: paths_changed, result: both,
                 subject: implementation, subject_revision: h2}
      - observed_at: "2026-10-27T09:40:00Z"
        record: {format: canon-evidence/1, id: gate-h2-pass, kind: gate_result, result: pass,
                 subject: implementation, subject_revision: h2}
      - observed_at: "2026-10-27T09:45:00Z"
        record: {format: canon-evidence/1, id: pr-h2, kind: pull_request, result: open,
