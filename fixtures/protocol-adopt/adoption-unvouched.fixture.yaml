format: els-fixture/1
id: adoption-unvouched
protocol: protocols/protocol-adopt/1.yaml
at: "2026-10-29T12:00:00Z"

# Both reports hold for r1, but the approval record comes from the principal that generated the
# protocol, which the case does not list as independent, and then from nobody named at all: each
# is excluded as not_independent, adoption.approved is unknown, and nothing is adopted, whatever
# the grant says. Canon outcomes read claims, not authority decisions, so this is what keeps an
# approval record nobody vouches for from adopting.
case:
  format: canon-case/1
  id: ADOPT-5
  protocol: protocol.adopt
  independence:
    approver: [different_principal]
    generator: []
  artifacts:
    generated_protocol: {revision: r1}

states:
  - id: approved-by-the-generator
    add_authority:
      - {capability: protocol.adopt, decision: granted}
    add_evidence:
      - observed_at: "2026-10-29T11:00:00Z"
        record: {format: canon-evidence/1, id: diff-r1, kind: diff_report, result: within_floor,
                 subject: generated_protocol, subject_revision: r1}
      - observed_at: "2026-10-29T11:05:00Z"
        record: {format: canon-evidence/1, id: check-r1, kind: check_report, result: passed,
                 subject: generated_protocol, subject_revision: r1}
      - observed_at: "2026-10-29T11:30:00Z"
        record: {format: canon-evidence/1, id: approval-generator-r1, kind: adoption_approval,
                 result: approved, subject: generated_protocol, subject_revision: r1,
                 producer: generator}
    expect:
      claims:
        floor.respected: true
        checks.pass: true
        adoption.approved: unknown
      actions:
        protocol.check: admissible
        protocol.diff: admissible
        protocol.approve: admissible
      outcomes:
        adopted: blocked

  - id: approved-by-nobody-named
    add_evidence:
      - observed_at: "2026-10-29T11:40:00Z"
        record: {format: canon-evidence/1, id: approval-anonymous-r1, kind: adoption_approval,
                 result: approved, subject: generated_protocol, subject_revision: r1}
    expect:
      claims:
        floor.respected: true
        checks.pass: true
        adoption.approved: unknown
      actions:
        protocol.check: admissible
        protocol.diff: admissible
        protocol.approve: admissible
      outcomes:
        adopted: blocked
