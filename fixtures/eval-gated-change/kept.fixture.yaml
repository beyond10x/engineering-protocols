format: els-fixture/1
id: kept
protocol: protocols/eval-gated-change/1.yaml
at: "2026-10-17T12:00:00Z"

# A loop run, run-a, wrote candidate h1 under evaluation design h1. With no evidence and no
# decision every claim is unknown, neither keep nor reject is admissible, and every outcome is
# blocked. Run-b, which the case lists as another agent run, then passes the design review, finds
# the candidate clean, reproduces its improvement on the tuning split and finds the held-out split
# held: every claim is true and `kept` is legitimate, but keeping still waits on authority. Once
# `loop_change.keep` is granted, `change.keep` is admissible.
case:
  format: canon-case/1
  id: EGC-101
  protocol: eval.gated_change
  revision: c1
  independence:
    run-b: [different_agent_run]
  artifacts:
    eval_design: {revision: h1}
    candidate: {revision: h1}

states:
  - id: initial
    add_evidence: []
    expect:
      claims:
        experiment.valid: unknown
        change.within_surface: unknown
        content.clean: unknown
        tuning.improved: unknown
        result.reproducible: unknown
        heldout.not_regressed: unknown
        change.supported: unknown
      actions:
        design.review: approval-required
        candidate.evaluate: admissible
        change.keep: blocked
        change.reject: blocked
        change.propose: blocked
        change.apply_outside_surface: blocked
      outcomes:
        kept: blocked
        rejected: blocked
        proposed: blocked
        inconclusive: blocked

  - id: evidence-passing
    add_evidence:
      - observed_at: "2026-10-17T09:00:00Z"
        record: {format: canon-evidence/1, id: design-review-h1, kind: design_review,
                 result: passed, subject: eval_design, subject_revision: h1, producer: run-b}
      - observed_at: "2026-10-17T10:00:00Z"
        record: {format: canon-evidence/1, id: guard-check-h1, kind: guard_check,
                 result: clean, subject: candidate, subject_revision: h1, producer: run-b}
      - observed_at: "2026-10-17T10:10:00Z"
        record: {format: canon-evidence/1, id: tuning-comparison-h1, kind: tuning_comparison,
                 result: reproduced, subject: candidate, subject_revision: h1, producer: run-b}
      - observed_at: "2026-10-17T10:20:00Z"
        record: {format: canon-evidence/1, id: heldout-comparison-h1, kind: heldout_comparison,
                 result: held, subject: candidate, subject_revision: h1, producer: run-b}
    expect:
      claims:
        experiment.valid: true
        change.within_surface: true
        content.clean: true
        tuning.improved: true
        result.reproducible: true
        heldout.not_regressed: true
        change.supported: true
      actions:
        design.review: approval-required
        candidate.evaluate: admissible
        change.keep: approval-required
        change.reject: blocked
        change.propose: blocked
        change.apply_outside_surface: blocked
      outcomes:
        kept: legitimate
        rejected: blocked
        proposed: blocked
        inconclusive: blocked

  - id: keep-granted
    add_authority:
      - {capability: loop_change.keep, decision: granted}
    add_evidence: []
    expect:
      claims:
        experiment.valid: true
        change.within_surface: true
        content.clean: true
        tuning.improved: true
        result.reproducible: true
        heldout.not_regressed: true
        change.supported: true
      actions:
        design.review: approval-required
        candidate.evaluate: admissible
        change.keep: admissible
        change.reject: blocked
        change.propose: blocked
        change.apply_outside_surface: blocked
      outcomes:
        kept: legitimate
        rejected: blocked
        proposed: blocked
        inconclusive: blocked
