# The evidence of `kept`, about the current revisions, but produced by run-a, the loop run that
# wrote the candidate, which the case does not list as independent. Every record is excluded as
# not independent: the claims are unknown, not false, so the loop's own say-so neither keeps nor
# rejects the change, even with `loop_change.keep` granted.
