format: els-fixture/1
id: accepted-gaps
protocol: protocols/loop-improvement/1.yaml
at: "2026-10-26T12:00:00Z"

# Each state leaves one of acceptance's claims unestablished while the other two hold, and shows
# that the turn is not accepted. run-a delivered each candidate; run-b is independent of it on
# `different_agent_run`.
#
# - redefined-but-merged (lc1): the definition check found a metric redefined without its previous
#   figures, and lc1 is merged all the same; the merge record is built for this test, since
#   `loop.merge` waits for an honest definition. run-b's comparison shows the metric improved, but an improvement measured
#   on a silently redefined metric is not accepted.
# - improved-before-merge (lc2): the candidate leaves every definition unchanged, and run-b
#   compared the metric before anyone merged lc2; the comparison is built for this test, since
#   `loop.compare` waits for the merge. The records about lc1 are about an earlier revision
#   and count for nothing. An unmerged candidate is not accepted, however well it measured.
case:
  format: canon-case/1
  id: LI-107
  protocol: loop.improvement
  revision: c1
  independence:
    run-a: []
    run-b: [different_agent_run]
  artifacts:
    loop_baseline: {revision: lb1}
    loop_candidate: {revision: lc1}
    loop_finding: {revision: lf1}

states:
  - id: redefined-but-merged
    add_evidence:
      - observed_at: "2026-10-26T08:00:00Z"
        record: {format: canon-evidence/1, id: measurement-lb1, kind: loop_measurement,
                 result: below_target, subject: loop_baseline, subject_revision: lb1}
      - observed_at: "2026-10-26T09:00:00Z"
        record: {format: canon-evidence/1, id: definitions-lc1, kind: definition_check,
                 result: redefined, subject: loop_candidate, subject_revision: lc1}
      - observed_at: "2026-10-26T09:30:00Z"
        record: {format: canon-evidence/1, id: merge-lc1, kind: merge_observation,
                 result: merged, subject: loop_candidate, subject_revision: lc1}
      - observed_at: "2026-10-26T11:00:00Z"
        record: {format: canon-evidence/1, id: comparison-lc1, kind: loop_comparison,
                 result: improved, subject: loop_candidate, subject_revision: lc1,
                 producer: run-b}
    expect:
      claims:
        loop.metric_below_target: true
        loop.definition_honest: false
        loop.change_merged: true
        loop.metric_improved: true
      obligations:
        honesty.required: open
        improvement.required: discharged
      actions:
        loop.measure: admissible
        loop.finding.file: admissible
        loop.change.deliver: admissible
        loop.definition.check: admissible
        loop.merge: blocked
        loop.compare: admissible
      outcomes: &none
        accepted: blocked
        declined: blocked
        abandoned: blocked

  - id: improved-before-merge
    set_revisions:
      loop_candidate: lc2
    add_evidence:
      - observed_at: "2026-10-26T11:10:00Z"
        record: {format: canon-evidence/1, id: definitions-lc2, kind: definition_check,
                 result: unchanged, subject: loop_candidate, subject_revision: lc2}
      - observed_at: "2026-10-26T11:40:00Z"
        record: {format: canon-evidence/1, id: trial-comparison-lc2, kind: loop_comparison,
                 result: improved, subject: loop_candidate, subject_revision: lc2,
                 producer: run-b}
    expect:
      claims:
        loop.metric_below_target: true
        loop.definition_honest: true
        loop.change_merged: unknown
        loop.metric_improved: true
      obligations:
        honesty.required: discharged
        improvement.required: discharged
      actions:
        loop.measure: admissible
        loop.finding.file: admissible
        loop.change.deliver: admissible
        loop.definition.check: admissible
        loop.merge: approval-required
        loop.compare: blocked
      outcomes: *none
