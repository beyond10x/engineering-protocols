format: vocabulary/1

terms:
  - id: intent
    category: artifact_kind
    marking: core
    meaning: what the change or response is meant to achieve
  - id: system_specification
    category: artifact_kind
    marking: core
    meaning: the specified behaviour of the system concerned
  - id: plan
    category: artifact_kind
    marking: core
    meaning: the intended steps toward the intent
  - id: release
    category: artifact_kind
    marking: core
    meaning: a versioned, deployable unit of the system
  - id: deployment
    category: artifact_kind
    marking: core
    meaning: a release running in an environment
  - id: service
    category: artifact_kind
    marking: core
    meaning: the running service a case concerns
  - id: implementation
    category: artifact_kind
    marking: software.change
    meaning: a revision of the code that realizes the plan
  - id: operational_observation
    category: evidence_kind
    marking: core
    meaning: an observation of the running system
  - id: objective_observation
    category: evidence_kind
    marking: core
    meaning: an observation of whether the intent's objective is met
  - id: impact_assessment
    category: evidence_kind
    marking: core
    meaning: an assessment of who and what an incident affects
  - id: cause_analysis
    category: evidence_kind
    marking: core
    meaning: an analysis of why an incident happened
  - id: test_result
    category: evidence_kind
    marking: software.change
    meaning: the result of running tests against an implementation revision
  - id: code_review
    category: evidence_kind
    marking: software.change
    meaning: a review of an implementation revision
  - id: build_provenance
    category: evidence_kind
    marking: software.change
    meaning: the record of how a release was built from an implementation
  - id: release.proven
    category: claim_id
    marking: core
    meaning: the release comes from a verified implementation and carries current build provenance
  - id: deployment.healthy
    category: claim_id
    marking: core
    meaning: the deployment is running healthily
  - id: objective.realized
    category: claim_id
    marking: core
    meaning: the intent's objective is met
  - id: impact.bounded
    category: claim_id
    marking: core
    meaning: the incident's impact is known and contained
  - id: service.healthy
    category: claim_id
    marking: core
    meaning: the service is running healthily
  - id: cause.identified
    category: claim_id
    marking: core
    meaning: the incident's cause is known
  - id: tests.pass
    category: claim_id
    marking: software.change
    meaning: the tests pass for the current implementation revision
  - id: implementation.reviewed
    category: claim_id
    marking: software.change
    meaning: the current implementation revision is reviewed
  - id: implementation.verified
    category: claim_id
    marking: software.change
    meaning: the current implementation revision is verified
  - id: metrics.inspect
    category: action_id
    marking: core
    meaning: read the system's metrics
  - id: logs.search
    category: action_id
    marking: core
    meaning: search the system's logs
  - id: release.inspect
    category: action_id
    marking: core
    meaning: read what a release contains
  - id: release.rollback
    category: action_id
    marking: core
    meaning: return to a previous release
  - id: traffic.shift
    category: action_id
    marking: core
    meaning: move traffic between deployments
  - id: emergency.leave
    category: action_id
    marking: core
    meaning: leave emergency mode
  - id: repository.inspect
    category: action_id
    marking: software.change
    meaning: read the repository
  - id: repository.merge
    category: action_id
    marking: software.change
    meaning: merge a revision into the repository's mainline
  - id: tests.run
    category: action_id
    marking: software.change
    meaning: run the tests against an implementation revision
  - id: restore_service
    category: obligation_id
    marking: core
    meaning: bring the affected service back to health
  - id: accepted
    category: outcome_id
    marking: core
    meaning: the case closed with its result accepted
  - id: investigate_cause
    category: obligation_id
    marking: core
    meaning: establish why the incident happened
  - id: declined
    category: outcome_id
    marking: core
    meaning: the case closed without carrying out its intent, on a decision not to or on evidence that its candidate did not achieve it
  - id: rolled_back
    category: outcome_id
    marking: core
    meaning: the case closed with its release returned to a previous one
  - id: superseded
    category: outcome_id
    marking: core
    meaning: the case closed on a decision that another case replaces it
  - id: abandoned
    category: outcome_id
    marking: core
    meaning: the case closed on a decision to stop before it reached any planned outcome
  - id: rollback_result
    category: evidence_kind
    marking: core
    meaning: the result of returning to a previous release, complete or partial
  - id: explicitly_declined
    category: decision_name
    marking: core
    meaning: a recorded decision not to carry out the case's intent
  - id: explicitly_superseded
    category: decision_name
    marking: core
    meaning: a recorded decision that another case replaces this one
  - id: explicitly_abandoned
    category: decision_name
    marking: core
    meaning: a recorded decision to stop the case before it reaches any planned outcome
  - id: experiment_design
    category: artifact_kind
    marking: core
    meaning: the metrics, splits, seeds and success criterion an experiment is run under
  - id: dataset_snapshot
    category: artifact_kind
    marking: core
    meaning: the frozen data an experiment's runs read
  - id: baseline
    category: artifact_kind
    marking: core
    meaning: the reference model, method or revision a candidate is compared with
  - id: candidate
    category: artifact_kind
    marking: core
    meaning: the model, method or revision under test
  - id: run_configuration
    category: artifact_kind
    marking: core
    meaning: the settings and environment an experiment's runs used
  - id: results
    category: artifact_kind
    marking: core
    meaning: the metrics an experiment's runs produced
  - id: design_review
    category: evidence_kind
    marking: core
    meaning: a review of an experiment design, passed or failed
  - id: integrity_check
    category: evidence_kind
    marking: core
    meaning: a check of the runs behind a set of results for integrity violations, clean or violated
  - id: reproduction
    category: evidence_kind
    marking: core
    meaning: a rerun on the same dataset snapshot and run configuration, matched or diverged
  - id: comparison
    category: evidence_kind
    marking: core
    meaning: a comparison of a candidate with the baseline, candidate_better or baseline_better
  - id: seed_sweep
    category: evidence_kind
    marking: core
    meaning: a sweep of a candidate's effect over seeds or ablations, stable or unstable
  - id: experiment.valid
    category: claim_id
    marking: core
    meaning: the experiment design passed review and the results carry no integrity violation
  - id: result.reproducible
    category: claim_id
    marking: core
    meaning: a reproduction of the current results matched them
  - id: candidate.beats_baseline
    category: claim_id
    marking: core
    meaning: a comparison of the current candidate found it better than the baseline
  - id: effect.robust
    category: claim_id
    marking: core
    meaning: a sweep of the current candidate found its effect stable
  - id: hypothesis.supported
    category: claim_id
    marking: core
    meaning: the experiment is valid and reproducible, and the candidate beats the baseline robustly
  - id: supported
    category: outcome_id
    marking: core
    meaning: the case closed with its hypothesis supported
  - id: refuted
    category: outcome_id
    marking: core
    meaning: the case closed with its hypothesis refuted by a valid, reproducible result
  - id: invalid_experiment
    category: outcome_id
    marking: core
    meaning: the case closed because its experiment is not valid
  - id: inconclusive
    category: outcome_id
    marking: core
    meaning: the case closed on a decision that its experiment settles nothing
  - id: explicitly_inconclusive
    category: decision_name
    marking: core
    meaning: a recorded decision that the case's evidence settles nothing
  - id: tests.write
    category: action_id
    marking: software.change
    meaning: change the tests in the repository's working revision
  - id: implementation.edit
    category: action_id
    marking: software.change
    meaning: change the implementation in the repository's working revision
  - id: regression.reproduced
    category: claim_id
    marking: software.change
    meaning: a failing test has reproduced the regression a bugfix repairs
  - id: tests.required
    category: obligation_id
    marking: software.change
    meaning: the tests must pass for the current implementation revision
  - id: review.required
    category: obligation_id
    marking: software.change
    meaning: the current implementation revision must be reviewed
  - id: provenance.required
    category: obligation_id
    marking: software.change
    meaning: the release must be proven, its build provenance recorded
  - id: health.required
    category: obligation_id
    marking: core
    meaning: the deployment must be observed healthy
  - id: risk
    category: case_input
    marking: core
    meaning: how much proof a case must carry, fixed when it opens; it selects the obligations that apply
  - id: trivial
    category: input_value
    marking: core
    meaning: the lowest risk; a change whose tests must pass and nothing more
  - id: standard
    category: input_value
    marking: core
    meaning: the usual risk; everything trivial requires, and review
  - id: elevated
    category: input_value
    marking: core
    meaning: a raised risk; everything standard requires, and a proven release
  - id: critical
    category: input_value
    marking: core
    meaning: the highest risk; everything elevated requires, and a healthy deployment
  - id: change_kind
    category: case_input
    marking: software.change
    meaning: what a change to software is, fixed when its case opens; it selects whether a regression must be reproduced first
  - id: feature
    category: input_value
    marking: software.change
    meaning: a change that adds or alters behaviour
  - id: bugfix
    category: input_value
    marking: software.change
    meaning: a change that repairs a regression, which a failing test must reproduce before the implementation is edited
  - id: refactor
    category: input_value
    marking: software.change
    meaning: a change to the implementation that keeps its behaviour
  - id: regression_test_result
    category: evidence_kind
    marking: software.change
    meaning: the result of running a bugfix's regression test against an implementation revision
  - id: implementation_change
    category: evidence_kind
    marking: software.change
    meaning: the record that the implementation was changed, moving it to a new revision
  - id: regression.shown_first
    category: claim_id
    marking: software.change
    meaning: a bugfix's regression test failed on its first run, before the implementation was first changed
  - id: red_first.required
    category: obligation_id
    marking: software.change
    meaning: a bugfix's regression test must fail on its first run, before the implementation is first changed
  - id: affects_security_boundary
    category: case_input
    marking: core
    meaning: whether a change affects a security boundary, fixed when its case opens; one that does needs an independent security review
  - id: "true"
    category: input_value
    marking: core
    meaning: the value of a yes-or-no case input when what it asks holds
  - id: "false"
    category: input_value
    marking: core
    meaning: the value of a yes-or-no case input when what it asks does not hold
  - id: security_review
    category: evidence_kind
    marking: software.change
    meaning: a review of an implementation revision's effect on a security boundary
  - id: security.reviewed
    category: claim_id
    marking: software.change
    meaning: the current implementation revision's security review is approved by another principal than the implementer
  - id: security_review.required
    category: obligation_id
    marking: software.change
    meaning: a change that affects a security boundary must be security reviewed by another principal than the implementer
  - id: different_principal
    category: independence_dimension
    marking: core
    meaning: the producer of a record is another principal than the one who did the case's work
  - id: different_agent_run
    category: independence_dimension
    marking: core
    meaning: the producer of a record is another agent run than the one that did the case's work
  - id: rollback.verified
    category: claim_id
    marking: core
    meaning: the release's rollback is complete, by a rollback result from another principal than the one who rolled it back
  - id: eval_design
    category: artifact_kind
    marking: core
    meaning: the evaluation design an automated loop is tuned under, its splits, metrics and guards
  - id: guard_check
    category: evidence_kind
    marking: core
    meaning: a check of a candidate against the surface a loop may change and for leaked or forbidden content, outside, leaked or clean
  - id: tuning_comparison
    category: evidence_kind
    marking: core
    meaning: a first and a second run of a candidate against the baseline on the tuning split, reproduced, not_reproduced or not_better
  - id: heldout_comparison
    category: evidence_kind
    marking: core
    meaning: a run of a candidate against the baseline on the held-out split, held or regressed
  - id: change.within_surface
    category: claim_id
    marking: core
    meaning: an independent guard check did not find the current candidate outside the surface the loop may change
  - id: content.clean
    category: claim_id
    marking: core
    meaning: an independent guard check found the current candidate free of expected answers and new forbidden content
  - id: tuning.improved
    category: claim_id
    marking: core
    meaning: an independent first run of the current candidate on the tuning split was better than the baseline
  - id: heldout.not_regressed
    category: claim_id
    marking: core
    meaning: an independent run of the current candidate on the held-out split did not regress against the baseline
  - id: change.supported
    category: claim_id
    marking: core
    meaning: every keep claim holds for the current candidate revision
  - id: design.review
    category: action_id
    marking: core
    meaning: review the evaluation design, under authority
  - id: candidate.evaluate
    category: action_id
    marking: core
    meaning: check and run the current candidate revision, producing its guard check and comparisons
  - id: change.keep
    category: action_id
    marking: core
    meaning: keep a candidate a loop produced, on every keep claim and authority to keep
  - id: change.reject
    category: action_id
    marking: core
    meaning: discard a candidate once every keep claim is decided and one is false
  - id: change.propose
    category: action_id
    marking: core
    meaning: hand a candidate that leaves the loop's surface to a person as a proposal, applying nothing
  - id: change.apply_outside_surface
    category: action_id
    marking: core
    meaning: apply a candidate that leaves the loop's surface, under a capability never granted to a loop
  - id: kept
    category: outcome_id
    marking: core
    meaning: the case closed with its candidate kept
  - id: rejected
    category: outcome_id
    marking: core
    meaning: the case closed with its candidate rejected on a false keep claim
  - id: proposed
    category: outcome_id
    marking: core
    meaning: the case closed with its candidate proposed to a person, because it leaves the loop's surface
  - id: change_record
    category: evidence_kind
    marking: software.change
    meaning: whether merging an implementation revision into the base branch's tip would change that tip's tree outside .engineering/
  - id: ci_result
    category: evidence_kind
    marking: software.change
    meaning: the result of continuous integration on an implementation revision
  - id: gate_result
    category: evidence_kind
    marking: software.change
    meaning: the result of the repository's gate against an implementation revision
  - id: handover
    category: evidence_kind
    marking: software.change
    meaning: the record that the harness chose to hand the change over at an implementation revision, changing no file
  - id: merge_observation
    category: evidence_kind
    marking: software.change
    meaning: the observation that a revision, or the pull request whose head it is, was merged into the repository's mainline
  - id: pull_request
    category: evidence_kind
    marking: software.change
    meaning: a pull request whose head is an implementation revision, or that revision with only the commits that record its approval above it
  - id: change.handed_over
    category: claim_id
    marking: software.change
    meaning: the harness handed the change over at the current implementation revision, saying it is complete
  - id: change.made
    category: claim_id
    marking: software.change
    meaning: merging the current implementation revision into the base branch's tip would change its tree outside .engineering/
  - id: ci.green
    category: claim_id
    marking: software.change
    meaning: continuous integration passes for the current implementation revision
  - id: gate.green
    category: claim_id
    marking: software.change
    meaning: the repository's gate is green for the current implementation revision
  - id: pr.merged
    category: claim_id
    marking: software.change
    meaning: the pull request for the current implementation revision is merged
  - id: pr.opened
    category: claim_id
    marking: software.change
    meaning: a pull request is open for the current implementation revision
  - id: change.handover
    category: action_id
    marking: software.change
    meaning: hand the change over, changing no file, once it is complete and no further edit is needed
  - id: change.read
    category: action_id
    marking: software.change
    meaning: read whether merging the implementation revision into the base branch's tip would change its tree outside .engineering/
  - id: ci.read
    category: action_id
    marking: software.change
    meaning: read the continuous integration result for the pull request's head
  - id: gate.run
    category: action_id
    marking: software.change
    meaning: run the repository's gate against an implementation revision
  - id: pr.open
    category: action_id
    marking: software.change
    meaning: push the implementation revision and open its pull request through the repository's bot route
  - id: ci.required
    category: obligation_id
    marking: software.change
    meaning: continuous integration must pass for the current implementation revision
  - id: gate.required
    category: obligation_id
    marking: software.change
    meaning: the repository's gate must be green for the current implementation revision
  - id: merge.required
    category: obligation_id
    marking: software.change
    meaning: the pull request for the current implementation revision must be merged
  - id: finding
    category: artifact_kind
    marking: self.improvement
    meaning: a finding against the agent runtime, filed with a machine-checkable predicate and the record that produced it
  - id: promotion
    category: artifact_kind
    marking: self.improvement
    meaning: the agent runtime's binary installed for runs, built from a named revision
  - id: finding_record
    category: evidence_kind
    marking: self.improvement
    meaning: the finding as filed, with a predicate that parses and a source that exists, or malformed
  - id: promotion_record
    category: evidence_kind
    marking: self.improvement
    meaning: the installed binary's embedded revision compared with the merged candidate revision
  - id: scenario_result
    category: evidence_kind
    marking: self.improvement
    meaning: the finding's predicate run on its scenario, or on its repository at its seed, with the runtime built from a revision
  - id: scorecard_result
    category: evidence_kind
    marking: self.improvement
    meaning: every scenario of the corpus run at a candidate revision and compared with the baseline's record for the same scenario
  - id: finding.cited
    category: claim_id
    marking: self.improvement
    meaning: the finding is filed with a predicate that parses and a source that exists
  - id: fix.merged
    category: claim_id
    marking: self.improvement
    meaning: the current candidate revision is merged into the mainline
  - id: scenario.passes_after
    category: claim_id
    marking: self.improvement
    meaning: the finding's predicate fails on the current candidate revision, observed by another agent run than the one that delivered it
  - id: scenario.reproduced_before
    category: claim_id
    marking: self.improvement
    meaning: the finding's predicate holds on the baseline revision
  - id: scorecard.no_regression
    category: claim_id
    marking: self.improvement
    meaning: no scenario of the corpus is worse at the current candidate revision than at the baseline
  - id: binary.promote
    category: action_id
    marking: self.improvement
    meaning: build the merged candidate, embed its revision and install it for runs
  - id: candidate.merge
    category: action_id
    marking: self.improvement
    meaning: merge a candidate that touches no judge surface
  - id: candidate.merge_judge_surface
    category: action_id
    marking: self.improvement
    meaning: merge a candidate that touches a judge surface, under the owner's capability or a revocable delegation of it
  - id: finding.file
    category: action_id
    marking: self.improvement
    meaning: file the finding in the planning store with its predicate and its source
  - id: scenario.reproduce
    category: action_id
    marking: self.improvement
    meaning: run the finding's predicate with the runtime built from the baseline
  - id: scenario.verify
    category: action_id
    marking: self.improvement
    meaning: run the finding's predicate with the runtime built from the candidate
  - id: scorecard.compare
    category: action_id
    marking: self.improvement
    meaning: run the scenario corpus at the merged candidate and compare it with the baseline
  - id: regression.required
    category: obligation_id
    marking: self.improvement
    meaning: the scorecard must show no regression at the candidate
  - id: reproduction.required
    category: obligation_id
    marking: self.improvement
    meaning: the finding must be reproduced on the baseline before a candidate counts
  - id: verification.required
    category: obligation_id
    marking: self.improvement
    meaning: the finding must be verified gone on the candidate by another run
  - id: unreproducible
    category: outcome_id
    marking: self.improvement
    meaning: the turn closed because the finding's predicate does not hold on the baseline
  - id: surface
    category: case_input
    marking: self.improvement
    meaning: whether the candidate's change, base to head, touches a judge surface
  - id: judge
    category: input_value
    marking: self.improvement
    meaning: the candidate's change touches a judge surface
  - id: non_judge
    category: input_value
    marking: self.improvement
    meaning: the candidate's change touches no judge surface
  - id: loop_baseline
    category: artifact_kind
    marking: loop.improvement
    meaning: the promoted loop definition a loop metric was measured on
  - id: loop_candidate
    category: artifact_kind
    marking: loop.improvement
    meaning: a changed loop definition meant to raise a loop metric
  - id: loop_finding
    category: artifact_kind
    marking: loop.improvement
    meaning: a finding against the improvement loop, naming the metric, its target and the turns it was computed from
  - id: definition_check
    category: evidence_kind
    marking: loop.improvement
    meaning: a loop candidate's metric definitions compared with the baseline's; unchanged, dual_reported or redefined
  - id: loop_comparison
    category: evidence_kind
    marking: loop.improvement
    meaning: a loop metric over turns under the candidate compared with the same metric under the baseline
  - id: loop_measurement
    category: evidence_kind
    marking: loop.improvement
    meaning: the loop scorecard over at least three recorded self-improvement turns at a loop definition revision
  - id: loop.change_merged
    category: claim_id
    marking: loop.improvement
    meaning: the current loop candidate is merged into the mainline
  - id: loop.definition_honest
    category: claim_id
    marking: loop.improvement
    meaning: the current loop candidate leaves every metric definition unchanged, or reports the previous definition's figures beside the new ones
  - id: loop.metric_below_target
    category: claim_id
    marking: loop.improvement
    meaning: a loop metric is below its target on the baseline loop definition
  - id: loop.metric_improved
    category: claim_id
    marking: loop.improvement
    meaning: the metric improved under the current loop candidate, observed by another agent run than the one that delivered it
  - id: loop.compare
    category: action_id
    marking: loop.improvement
    meaning: compare the metric with the baseline's once at least three turns ran under the merged candidate
  - id: loop.measure
    category: action_id
    marking: loop.improvement
    meaning: compute the loop scorecard over the recorded self-improvement turns
  - id: loop.merge
    category: action_id
    marking: loop.improvement
    meaning: merge the loop candidate under the owner's capability or a revocable delegation of it
  - id: honesty.required
    category: obligation_id
    marking: loop.improvement
    meaning: a loop change never redefines a metric silently
  - id: improvement.required
    category: obligation_id
    marking: loop.improvement
    meaning: a loop change counts only when its metric improved
  - id: tests_change
    category: evidence_kind
    marking: software.change
    meaning: the record that a story's tests were written, moving the implementation to a new revision
  - id: paths_changed
    category: evidence_kind
    marking: software.change
    meaning: which paths an implementation revision changes since the base branch's tip, test paths, implementation paths, both or neither
  - id: tests.shown_red
    category: claim_id
    marking: software.change
    meaning: a story's tests failed on their first run, and were written before that run
  - id: change.complete
    category: claim_id
    marking: software.change
    meaning: the current implementation revision changes both test paths and implementation paths since the base, with its tests and gate green at that same revision
  - id: tests_first
    category: case_input
    marking: software.change
    meaning: whether a story's tests must fail before its implementation is edited, fixed when its case opens
  - id: required
    category: input_value
    marking: software.change
    meaning: the story's tests must fail on their first run before the implementation is edited
  - id: optional
    category: input_value
    marking: software.change
    meaning: the implementation may be edited whatever the tests have done
  - id: gate_on
    category: case_input
    marking: software.change
    meaning: when the repository's gate runs, fixed when a story's case opens
  - id: after_handover
    category: input_value
    marking: software.change
    meaning: the gate runs once, on the revision whose tests pass and whose change is handed over
  - id: each_revision
    category: input_value
    marking: software.change
    meaning: the gate runs at every revision, whenever asked
