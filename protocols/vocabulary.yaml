format: vocabulary/1

terms:
  - id: intent
    category: artifact_kind
    marking: core
    meaning: what the change or response is meant to achieve
  - id: system_specification
    category: artifact_kind
    marking: core
    meaning: the specified behaviour of the system concerned
  - id: plan
    category: artifact_kind
    marking: core
    meaning: the intended steps toward the intent
  - id: release
    category: artifact_kind
    marking: core
    meaning: a versioned, deployable unit of the system
  - id: deployment
    category: artifact_kind
    marking: core
    meaning: a release running in an environment
  - id: service
    category: artifact_kind
    marking: core
    meaning: the running service a case concerns
  - id: implementation
    category: artifact_kind
    marking: software.change
    meaning: a revision of the code that realizes the plan
  - id: operational_observation
    category: evidence_kind
    marking: core
    meaning: an observation of the running system
  - id: objective_observation
    category: evidence_kind
    marking: core
    meaning: an observation of whether the intent's objective is met
  - id: impact_assessment
    category: evidence_kind
    marking: core
    meaning: an assessment of who and what an incident affects
  - id: cause_analysis
    category: evidence_kind
    marking: core
    meaning: an analysis of why an incident happened
  - id: test_result
    category: evidence_kind
    marking: software.change
    meaning: the result of running tests against an implementation revision
  - id: code_review
    category: evidence_kind
    marking: software.change
    meaning: a review of an implementation revision
  - id: build_provenance
    category: evidence_kind
    marking: software.change
    meaning: the record of how a release was built from an implementation
  - id: release.proven
    category: claim_id
    marking: core
    meaning: the release comes from a verified implementation and carries current build provenance
  - id: deployment.healthy
    category: claim_id
    marking: core
    meaning: the deployment is running healthily
  - id: objective.realized
    category: claim_id
    marking: core
    meaning: the intent's objective is met
  - id: impact.bounded
    category: claim_id
    marking: core
    meaning: the incident's impact is known and contained
  - id: service.healthy
    category: claim_id
    marking: core
    meaning: the service is running healthily
  - id: cause.identified
    category: claim_id
    marking: core
    meaning: the incident's cause is known
  - id: tests.pass
    category: claim_id
    marking: software.change
    meaning: the tests pass for the current implementation revision
  - id: implementation.reviewed
    category: claim_id
    marking: software.change
    meaning: the current implementation revision is reviewed
  - id: implementation.verified
    category: claim_id
    marking: software.change
    meaning: the current implementation revision is verified
  - id: metrics.inspect
    category: action_id
    marking: core
    meaning: read the system's metrics
  - id: logs.search
    category: action_id
    marking: core
    meaning: search the system's logs
  - id: release.inspect
    category: action_id
    marking: core
    meaning: read what a release contains
  - id: release.rollback
    category: action_id
    marking: core
    meaning: return to a previous release
  - id: traffic.shift
    category: action_id
    marking: core
    meaning: move traffic between deployments
  - id: emergency.leave
    category: action_id
    marking: core
    meaning: leave emergency mode
  - id: repository.inspect
    category: action_id
    marking: software.change
    meaning: read the repository
  - id: repository.merge
    category: action_id
    marking: software.change
    meaning: merge a revision into the repository's mainline
  - id: tests.run
    category: action_id
    marking: software.change
    meaning: run the tests against an implementation revision
  - id: restore_service
    category: obligation_id
    marking: core
    meaning: bring the affected service back to health
  - id: accepted
    category: outcome_id
    marking: core
    meaning: the case closed with its result accepted
  - id: investigate_cause
    category: obligation_id
    marking: core
    meaning: establish why the incident happened
  - id: declined
    category: outcome_id
    marking: core
    meaning: the case closed on a decision not to carry out its intent
  - id: rolled_back
    category: outcome_id
    marking: core
    meaning: the case closed with its release returned to a previous one
  - id: superseded
    category: outcome_id
    marking: core
    meaning: the case closed on a decision that another case replaces it
  - id: abandoned
    category: outcome_id
    marking: core
    meaning: the case closed on a decision to stop before it reached any planned outcome
  - id: rollback_result
    category: evidence_kind
    marking: core
    meaning: the result of returning to a previous release, complete or partial
  - id: explicitly_declined
    category: decision_name
    marking: core
    meaning: a recorded decision not to carry out the case's intent
  - id: explicitly_superseded
    category: decision_name
    marking: core
    meaning: a recorded decision that another case replaces this one
  - id: explicitly_abandoned
    category: decision_name
    marking: core
    meaning: a recorded decision to stop the case before it reaches any planned outcome
  - id: experiment_design
    category: artifact_kind
    marking: core
    meaning: the metrics, splits, seeds and success criterion an experiment is run under
  - id: dataset_snapshot
    category: artifact_kind
    marking: core
    meaning: the frozen data an experiment's runs read
  - id: baseline
    category: artifact_kind
    marking: core
    meaning: the reference model or method a candidate is compared with
  - id: candidate
    category: artifact_kind
    marking: core
    meaning: the model or method under test
  - id: run_configuration
    category: artifact_kind
    marking: core
    meaning: the settings and environment an experiment's runs used
  - id: results
    category: artifact_kind
    marking: core
    meaning: the metrics an experiment's runs produced
  - id: design_review
    category: evidence_kind
    marking: core
    meaning: a review of an experiment design, passed or failed
  - id: integrity_check
    category: evidence_kind
    marking: core
    meaning: a check of the runs behind a set of results for integrity violations, clean or violated
  - id: reproduction
    category: evidence_kind
    marking: core
    meaning: a rerun on the same dataset snapshot and run configuration, matched or diverged
  - id: comparison
    category: evidence_kind
    marking: core
    meaning: a comparison of a candidate with the baseline, candidate_better or baseline_better
  - id: seed_sweep
    category: evidence_kind
    marking: core
    meaning: a sweep of a candidate's effect over seeds or ablations, stable or unstable
  - id: experiment.valid
    category: claim_id
    marking: core
    meaning: the experiment design passed review and the results carry no integrity violation
  - id: result.reproducible
    category: claim_id
    marking: core
    meaning: a reproduction of the current results matched them
  - id: candidate.beats_baseline
    category: claim_id
    marking: core
    meaning: a comparison of the current candidate found it better than the baseline
  - id: effect.robust
    category: claim_id
    marking: core
    meaning: a sweep of the current candidate found its effect stable
  - id: hypothesis.supported
    category: claim_id
    marking: core
    meaning: the experiment is valid and reproducible, and the candidate beats the baseline robustly
  - id: supported
    category: outcome_id
    marking: core
    meaning: the case closed with its hypothesis supported
  - id: refuted
    category: outcome_id
    marking: core
    meaning: the case closed with its hypothesis refuted by a valid, reproducible result
  - id: invalid_experiment
    category: outcome_id
    marking: core
    meaning: the case closed because its experiment is not valid
  - id: inconclusive
    category: outcome_id
    marking: core
    meaning: the case closed on a decision that its experiment settles nothing
  - id: explicitly_inconclusive
    category: decision_name
    marking: core
    meaning: a recorded decision that the case's evidence settles nothing
  - id: tests.write
    category: action_id
    marking: software.change
    meaning: change the tests in the repository's working revision
  - id: implementation.edit
    category: action_id
    marking: software.change
    meaning: change the implementation in the repository's working revision
  - id: regression.reproduced
    category: claim_id
    marking: software.change
    meaning: a failing test has reproduced the regression a bugfix repairs
  - id: tests.required
    category: obligation_id
    marking: software.change
    meaning: the tests must pass for the current implementation revision
  - id: review.required
    category: obligation_id
    marking: software.change
    meaning: the current implementation revision must be reviewed
  - id: provenance.required
    category: obligation_id
    marking: software.change
    meaning: the release must be proven, its build provenance recorded
  - id: health.required
    category: obligation_id
    marking: core
    meaning: the deployment must be observed healthy
  - id: risk
    category: case_input
    marking: core
    meaning: how much proof a case must carry, fixed when it opens; it selects the obligations that apply
  - id: trivial
    category: input_value
    marking: core
    meaning: the lowest risk; a change whose tests must pass and nothing more
  - id: standard
    category: input_value
    marking: core
    meaning: the usual risk; everything trivial requires, and review
  - id: elevated
    category: input_value
    marking: core
    meaning: a raised risk; everything standard requires, and a proven release
  - id: critical
    category: input_value
    marking: core
    meaning: the highest risk; everything elevated requires, and a healthy deployment
  - id: change_kind
    category: case_input
    marking: software.change
    meaning: what a change to software is, fixed when its case opens; it selects whether a regression must be reproduced first
  - id: feature
    category: input_value
    marking: software.change
    meaning: a change that adds or alters behaviour
  - id: bugfix
    category: input_value
    marking: software.change
    meaning: a change that repairs a regression, which a failing test must reproduce before the implementation is edited
  - id: refactor
    category: input_value
    marking: software.change
    meaning: a change to the implementation that keeps its behaviour
  - id: regression_test_result
    category: evidence_kind
    marking: software.change
    meaning: the result of running a bugfix's regression test against an implementation revision
  - id: implementation_change
    category: evidence_kind
    marking: software.change
    meaning: the record that the implementation was changed, moving it to a new revision
  - id: regression.shown_first
    category: claim_id
    marking: software.change
    meaning: a bugfix's regression test ran before the implementation was first changed
  - id: red_first.required
    category: obligation_id
    marking: software.change
    meaning: a bugfix's regression test must run before the implementation is first changed
